# Error budget alerts for the invoice API, multi-window multi-burn-rate.
#
# SLO: 99.9% of requests succeed (non-5xx) over 30 days, so the error budget
# is 0.1% of requests.
#
# Burn rate = how fast the budget is spent relative to "exactly on budget".
# Fast burn: page when 2% of the 30-day budget is gone in 1 hour:
#   0.02 * (30 days * 24 h) / 1 h = 14.4
# The 1h window shows it is significant, the 5m window (1/12 of it) that it is
# still happening, so the alert resolves quickly once the errors stop.
# Slow burn: ticket when 5% of the budget is gone in 6 hours:
#   0.05 * 720 / 6 = 6, checked on 6h and 30m.
# Sources: "SLIs and SLOs Demystified", lesson 68; Google SRE Workbook,
# chapter "Alerting on SLOs".
#
# Without any 5xx series the numerator would be empty and the ratio "no data";
# "or <denominator> * 0" turns it into a real 0.
# /healthz is not in http_requests_total (the app skips it), so health probes
# do not dilute the error ratio.
groups:
  - name: invoice-api-slo-ratios
    rules:
      - record: job:slo_errors_per_request:ratio_rate5m
        expr: |
          (
            sum by (job) (rate(http_requests_total{job="invoice-api",code=~"5.."}[5m]))
            or sum by (job) (rate(http_requests_total{job="invoice-api"}[5m])) * 0
          )
          / sum by (job) (rate(http_requests_total{job="invoice-api"}[5m]))
      - record: job:slo_errors_per_request:ratio_rate30m
        expr: |
          (
            sum by (job) (rate(http_requests_total{job="invoice-api",code=~"5.."}[30m]))
            or sum by (job) (rate(http_requests_total{job="invoice-api"}[30m])) * 0
          )
          / sum by (job) (rate(http_requests_total{job="invoice-api"}[30m]))
      - record: job:slo_errors_per_request:ratio_rate1h
        expr: |
          (
            sum by (job) (rate(http_requests_total{job="invoice-api",code=~"5.."}[1h]))
            or sum by (job) (rate(http_requests_total{job="invoice-api"}[1h])) * 0
          )
          / sum by (job) (rate(http_requests_total{job="invoice-api"}[1h]))
      - record: job:slo_errors_per_request:ratio_rate6h
        expr: |
          (
            sum by (job) (rate(http_requests_total{job="invoice-api",code=~"5.."}[6h]))
            or sum by (job) (rate(http_requests_total{job="invoice-api"}[6h])) * 0
          )
          / sum by (job) (rate(http_requests_total{job="invoice-api"}[6h]))

  - name: invoice-api-slo-alerts
    rules:
      - alert: InvoiceAPIErrorBudgetFastBurn
        expr: |
          job:slo_errors_per_request:ratio_rate1h > (14.4 * 0.001)
          and
          job:slo_errors_per_request:ratio_rate5m > (14.4 * 0.001)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Invoice API burns its 30-day error budget 14.4x too fast (2% in 1h)"
      - alert: InvoiceAPIErrorBudgetSlowBurn
        expr: |
          job:slo_errors_per_request:ratio_rate6h > (6 * 0.001)
          and
          job:slo_errors_per_request:ratio_rate30m > (6 * 0.001)
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Invoice API burns its 30-day error budget 6x too fast (5% in 6h)"
