global:
  scrape_interval: 5s # short for the demo; 15s-60s is common
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/slo.yml

scrape_configs:
  # The app's internal metrics port: reachable on the compose network,
  # never published on the host.
  - job_name: invoice-api
    static_configs:
      - targets: ["app:9091"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
